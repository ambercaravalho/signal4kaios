# The gateway is the only service exposed to the app; signal-cli-rest-api sits on an internal-only network the app never reaches. Both run from published images; nothing is built locally. From the repo root:
#
#   docker compose -f docker/docker-compose.yml up -d
#   docker compose -f docker/docker-compose.yml pull   # update later (then up -d again)
#   cp docker/.env.example docker/.env   # optional: only to override defaults
#
# Link your Signal account once (shows a QR code to scan in Signal -> Linked devices):
#   docker compose -f docker/docker-compose.yml exec gateway npm run link
#
# Pairing: on first start the gateway prints a pairing code to enter in the app.
#   docker compose -f docker/docker-compose.yml logs gateway            # show it
#   docker compose -f docker/docker-compose.yml exec gateway npm run pair     # new code
#   docker compose -f docker/docker-compose.yml exec gateway npm run devices  # list phones
#   docker compose -f docker/docker-compose.yml exec gateway npm run revoke 3 # unpair one
#
# To build the gateway from this checkout instead of pulling it, add the build override:
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.build.yml up -d --build

services:
  signal-cli-rest-api:
    image: bbernhard/signal-cli-rest-api:latest
    environment:
      # json-rpc mode keeps a persistent receive stream the gateway relays.
      - MODE=json-rpc
    volumes:
      - signal-cli-config:/home/.local/share/signal-cli
    networks:
      - internal
    # No ports published: only the gateway can reach it (linking goes through `npm run link` in the gateway).
    restart: unless-stopped

  gateway:
    image: ghcr.io/ambercaravalho/signal4kaios-gateway:latest
    depends_on:
      - signal-cli-rest-api
    environment:
      - PORT=8090
      - SIGNAL_CLI_URL=http://signal-cli-rest-api:8080
      - DB_PATH=/app/data/gateway.db
      - RETENTION_PER_NUMBER=500
      - PUSH_WHEN_IDLE_ONLY=true
      # Optional: generated on first start and saved in gateway-data if left empty.
      - VAPID_PUBLIC=${VAPID_PUBLIC:-}
      - VAPID_PRIVATE=${VAPID_PRIVATE:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:admin@example.com}
    volumes:
      - gateway-data:/app/data
    ports:
      # Pair the app with this address. For use away from home, put HTTPS in front (any reverse proxy, or a VPN); see docs/setup.md.
      - "8090:8090"
    networks:
      - internal
    restart: unless-stopped

networks:
  internal:
    driver: bridge

volumes:
  signal-cli-config:
  gateway-data:
