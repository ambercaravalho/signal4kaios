name: Build, test, and package
description: Installs the toolchain, builds the wasm, checks the generated protobuf codecs, then typechecks, tests, and packages the app into dist/.

inputs:
  release-tag:
    description: Tag being released; package.sh checks it against the manifest version and names the zip after it.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm

    # The built module and glue, keyed on every tracked file of the wrapper crate (the checkout has no build output yet). A hit skips the whole Rust build. Releases always build from source.
    - name: Restore the wasm build
      id: wasm
      if: inputs.release-tag == ''
      uses: actions/cache@v6
      with:
        path: |
          src/native/libsignal-wasm/pkg
          src/app/vendor/libsignal_wasm_bg.wasm
        key: wasm-${{ runner.os }}-${{ hashFiles('src/native/libsignal-wasm/**', 'src/native/libsignal-wasm/.cargo/**') }}

    # cmake and ninja build BoringSSL for contact discovery; build.sh downloads the pinned wasi-sdk into the cached target directory.
    - name: Install protoc, binaryen, LLVM, and cmake
      if: steps.wasm.outputs.cache-hit != 'true'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler binaryen clang llvm libclang-dev cmake ninja-build

    - name: Install the pinned Rust toolchain
      if: steps.wasm.outputs.cache-hit != 'true'
      shell: bash
      working-directory: src/native/libsignal-wasm
      run: rustup toolchain install

    - name: Read the pinned wasm-bindgen version
      if: steps.wasm.outputs.cache-hit != 'true'
      shell: bash
      run: echo "WASM_BINDGEN_VERSION=$(sed -n 's/^wasm-bindgen = "=\([^"]*\)"/\1/p' src/native/libsignal-wasm/Cargo.toml)" >> "$GITHUB_ENV"

    - name: Restore wasm-bindgen-cli
      if: steps.wasm.outputs.cache-hit != 'true'
      uses: actions/cache@v6
      with:
        path: ~/.cargo/bin/wasm-bindgen
        key: wasm-bindgen-${{ runner.os }}-${{ env.WASM_BINDGEN_VERSION }}

    # On a Cargo.lock change the newest older cache still covers most crates, BoringSSL (target/boringssl-wasi), and wasi-sdk. vendor/ keeps the patched libc's file times, which cargo uses to decide whether it and everything above it rebuild.
    - name: Restore the cargo cache
      if: steps.wasm.outputs.cache-hit != 'true'
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          src/native/libsignal-wasm/target
          src/native/libsignal-wasm/vendor
        key: cargo-${{ runner.os }}-${{ hashFiles('src/native/libsignal-wasm/Cargo.lock', 'src/native/libsignal-wasm/rust-toolchain.toml') }}-wbg${{ env.WASM_BINDGEN_VERSION }}
        restore-keys: cargo-${{ runner.os }}-

    - name: Install wasm-bindgen-cli
      if: steps.wasm.outputs.cache-hit != 'true'
      shell: bash
      run: |
        if ! wasm-bindgen --version 2>/dev/null | grep -q " $WASM_BINDGEN_VERSION$"; then
          cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked --force
        fi

    - shell: bash
      run: npm ci
    - name: Build the wasm module
      if: steps.wasm.outputs.cache-hit != 'true'
      shell: bash
      run: npm run build:wasm
    - name: Generated protobuf codecs are up to date
      shell: bash
      run: npm run gen:protos && git diff --exit-code -- src/engine/gen
    - shell: bash
      run: npm run typecheck
    - shell: bash
      run: npm test
    - name: Package
      shell: bash
      env:
        RELEASE_TAG: ${{ inputs.release-tag }}
      run: SKIP_WASM_BUILD=1 sh scripts/package.sh
