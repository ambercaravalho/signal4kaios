name: Gateway image

# Publishes ghcr.io/<owner>/signal4kaios-gateway: `edge` from main, `<version>`, `<major>.<minor>`, and `latest` from release tags (prereleases get only `<version>`). Pull requests build without pushing. Path filters don't apply to tag pushes, so every release tag publishes.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'gateway/**'
      - 'docker/**'
      - '.github/workflows/gateway-image.yml'
  pull_request:
    paths:
      - 'gateway/**'
      - 'docker/**'
      - '.github/workflows/gateway-image.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: gateway-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/signal4kaios-gateway

jobs:
  image:
    name: Build and publish gateway image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=edge,branch=main
            type=sha
          labels: |
            org.opencontainers.image.title=signal4kaios-gateway
            org.opencontainers.image.description=Gateway in front of signal-cli-rest-api for Signal4KaiOS

      - name: Build (and push unless PR)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          # arm64 under QEMU is slow, so PRs only check that the amd64 build works.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
