name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Package and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Package (Gecko-48 gate + version check)
        id: pkg
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sh app/scripts/package.sh
          echo "asset=signal4kaios-${RELEASE_TAG#v}.zip" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ASSET: ${{ steps.pkg.outputs.asset }}
          REPO: ${{ github.repository }}
        run: |
          awk -v h="## $TAG" '$0 == h { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no '## $TAG' section; write the release notes first." >&2
            exit 1
          fi
          cat >> notes.md <<EOF

          ### Install

          - **KaiOS 3.0 / 3.1 / 4.0:** copy \`$ASSET\` (still zipped) to the phone and install it from OStore's **Manual Install** tab → **Install app from sdcard**, or sideload it (unzipped) with \`appscmd\`; see [Setup](https://github.com/$REPO/blob/main/docs/setup.md#3-install-the-app).
          - **KaiOS 2.5:** sideload \`$ASSET\` (unzipped) with WebIDE; see [Setup](https://github.com/$REPO/blob/main/docs/setup.md#3-install-the-app).

          Signal4KaiOS needs your own self-hosted backend (signal-cli-rest-api + gateway). Set it up first: [Setup](https://github.com/$REPO/blob/main/docs/setup.md).
          EOF
          PRERELEASE=""
          case "$TAG" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$TAG" "dist/$ASSET" \
            --title "$TAG" \
            --notes-file notes.md \
            --generate-notes \
            $PRERELEASE
