name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: App packaging gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sh app/scripts/package.sh

  gateway:
    name: Gateway build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
