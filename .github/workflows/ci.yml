name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  WASM_BINDGEN_VERSION: 0.2.126

jobs:
  app:
    name: Build, test & package app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install protoc, binaryen, and LLVM
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler binaryen clang llvm

      - name: Install the pinned Rust toolchain
        working-directory: src/native/libsignal-wasm
        run: rustup toolchain install

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            src/native/libsignal-wasm/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src/native/libsignal-wasm/Cargo.lock', 'src/native/libsignal-wasm/rust-toolchain.toml') }}-wbg${{ env.WASM_BINDGEN_VERSION }}

      - name: Install wasm-bindgen-cli
        run: |
          if ! wasm-bindgen --version 2>/dev/null | grep -q " $WASM_BINDGEN_VERSION$"; then
            cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked --force
          fi

      - run: npm ci
      - run: npm run build:wasm
      - name: Generated protobuf codecs are up to date
        run: npm run gen:protos && git diff --exit-code -- src/engine/gen
      - run: npm run typecheck
      - run: npm test
      - run: SKIP_WASM_BUILD=1 sh scripts/package.sh
