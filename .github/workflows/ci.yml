name: CI

on:
  push:
    branches: [main, v2.0.0]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: Build, test & package app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: sh app/scripts/package.sh
