# Signal wire-format schemas, vendored unmodified so the generated codecs match the official clients exactly:
#   src/protos/signal-desktop/  from signalapp/Signal-Desktop v8.34.0 (9173731aaaccec8444066aec0e0c78725d7e457b), protos/
#   src/protos/libsignal/       from signalapp/libsignal v0.106.2 (850942581c06fa65c0323fd52029afa02fa1a1ba), rust/net/src/proto/
#   src/protos/ringrtc/         from signalapp/ringrtc v2.75.0 (1c386d798525564b273bc300d84088de567b8b3f), protobuf/protobuf/
# To update, copy the same files from the new tags, update the tags above and in docs/development.md, then run npm run gen:protos.
version: v2
modules:
  - path: src/protos/signal-desktop
  - path: src/protos/libsignal
  - path: src/protos/ringrtc
